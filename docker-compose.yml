version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/securedrive
      - SECRET_KEY=${SECRET_KEY}
      - FILE_ENCRYPTION_KEY=${FILE_ENCRYPTION_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    volumes:
      - ./backend/storage:/app/storage
      - ./backend:/app
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: securedrive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: